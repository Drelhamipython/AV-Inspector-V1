1px solid var(--line)}.check.pass .passBtn{background:#dcfce7;color:var(--green)}.check.fail .failBtn{background:#fee2e2;color:var(--red)}.check.na .naBtn{background:#f1f5f9;color:#334155}.checkBody{padding:12px}.checkBody b{font-size:14px}.checkBody div{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}.detail{border-top:1px solid var(--line);background:#f8fafc;padding:12px;display:none}.check.fail .detail,.check.open .detail{display:block}.critical{display:inline-block;margin-top:6px;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:900}.photoGrid{display:flex;gap:8px;flex-wrap:wrap}.photoActions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.photoAdd{position:relative;width:82px;height:72px;border:2px dashed #cbd5e1;border-radius:14px;display:grid;place-items:center;background:white;color:var(--muted);font-size:11px;font-weight:900;text-align:center;line-height:1.15}.photoAdd.camera{border-color:#93c5fd;background:#eff6ff;color:#1d4ed8}.photoAdd.gallery{border-color:#c4b5fd;background:#f5f3ff;color:#6d28d9}.photoAdd input{position:absolute;inset:0;opacity:0}.thumb{width:72px;height:72px;border-radius:14px;object-fit:cover;border:1px solid var(--line)}.photoWrap{position:relative;width:72px}.photoWrap .thumb{display:block}.photoBadge{position:absolute;left:4px;right:4px;bottom:4px;border-radius:999px;padding:2px 4px;font-size:8px;font-weight:1000;text-align:center;background:rgba(17,24,39,.82);color:white;backdrop-filter:blur(5px)}.photoBadge.reject{background:rgba(153,27,27,.86)}.photoBadge.warn{background:rgba(146,64,14,.86)}.photoMeta{font-size:10px;color:var(--muted);line-height:1.3;margin-top:4px}.photoQualityBox{margin-top:8px;padding:9px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);font-size:11px;color:#334155;line-height:1.45}.photoQualityBox b{font-size:11px}.stop{background:#fef2f2;border:2px solid #fecaca;color:#991b1b}.stop b{display:bl   $('sheet').innerHTML=`<h3>PDF Report Preview</h3><p class="small"><b>Photos fixed:</b> this version loads the report from a Blob file, not srcdoc, so watermarked photos are preserved better. CSV is only text/metadata; photos are included in this PDF/HTML report.</p><div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap"><button class="btn primary" onclick="printReportFrame()">Print / Save PDF</button><button class="btn light" onclick="openReportFullPage()">Open Full Report</button><button class="btn light" onclick="downloadReportHtml()">Download Report File</button><button class="btn light" onclick="closeModal()">Close</button></div><iframe id="reportFrame" style="width:100%;height:65vh;border:1px solid #e5e7eb;border-radius:14px;background:white" src="${state.lastReportUrl}"></iframe>`;
  $('modal').classList.remove('hidden');
  toast('PDF report ready with photos');
}
function printReportFrame(){let f=document.getElementById('reportFrame');if(f&&f.contentWindow){try{f.contentWindow.focus();setTimeout(()=>f.contentWindow.print(),300);toast('Choose Save as PDF')}catch(e){toast('Use Open Full Report, then Print')}}else{toast('Report preview not ready')}}
function openReportFullPage(){let html=state.lastReportHtml||'';if(!html){toast('No report to open');return}let blob=new Blob([html],{type:'text/html'});let url=URL.createObjectURL(blob);location.href=url}
function downloadReportHtml(){let html=state.lastReportHtml||'';if(!html){toast('No report to download');return}let blob=new Blob([html],{type:'text/html'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Amin_Ventures_Field_Report_with_Photos_'+new Date().toISOString().slice(0,10)+'.html';a.click();toast('Report file downloaded')}

function hardResetApp(){
  try{localStorage.removeItem('gc_field_location_app');localStorage.removeItem('gc_field_location_app_v12_clean');}
  catch(e){}
  if('caches' in window){caches.keys().then(keys=>keys.forEach(k=>caches.delete(k))).catch(()=>{});}
  if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>r.unregister())).catch(()=>{});}
  toast('Reset complete - reload app');
  setTimeout(()=>location.reload(true),700);
}
