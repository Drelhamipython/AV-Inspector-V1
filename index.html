<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#020617" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AV Inspector" />
<link rel="icon" href="./favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="manifest" href="./manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<title>AV Inspector — Punch List</title>
<style>
  :root {
    --bg: #f5f0e6;
    --bg-elev: #ffffff;
    --ink: #020617;
    --ink-soft: #4a4538;
    --ink-mute: #8a8270;
    --line: #e4dccb;
    --accent: #020617;
    --danger: #b91c1c;
    --warn: #c2410c;
    --ok: #166534;
    --critical: #991b1b;
    --major: #c2410c;
    --minor: #ca8a04;
    --shadow: 0 1px 2px rgba(2,6,23,.04), 0 4px 16px rgba(2,6,23,.06);
    --radius: 14px;
    --radius-sm: 10px;
    --radius-pill: 999px;
    --serif: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: var(--sans);
    font-size: 16px;
    color: var(--ink);
    background: var(--bg);
    overscroll-behavior-y: contain;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ----- Top bar ----- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--ink);
    color: var(--bg);
    padding: calc(env(safe-area-inset-top) + 14px) 20px 14px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: flex; align-items: center;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .brand-logo {
    height: 42px;
    width: auto;
    display: block;
    /* Image already has black background matching the topbar */
    border-radius: 4px;
  }
  .topbar-right { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .sync-badge {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius-pill);
    padding: 5px 11px;
    font-size: 11px;
    letter-spacing: 0.04em;
    display: flex; align-items: center; gap: 6px;
  }
  .sync-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #4ade80;
  }
  .sync-dot.pending { background: #fbbf24; }
  .sync-dot.offline { background: #94a3b8; }

  /* ----- Page header ----- */
  .page {
    padding: 24px 20px 120px;
    max-width: 720px;
    margin: 0 auto;
  }
  .page-title {
    font-family: var(--sans);
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.05;
    margin: 8px 0 6px;
  }
  .page-sub {
    color: var(--ink-mute);
    font-size: 14px;
    margin: 0 0 20px;
  }

  /* ----- Project picker ----- */
  .project-card {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 18px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    box-shadow: var(--shadow);
  }
  .project-card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-mute);
    margin-bottom: 4px;
  }
  .project-card .value {
    font-family: var(--sans);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.015em;
  }
  .project-card .value.empty { color: var(--ink-mute); font-style: italic; }
  .icon-btn {
    background: var(--ink); color: var(--bg);
    border: none; border-radius: var(--radius-pill);
    padding: 12px 20px;
    font-size: 14px;
    font-family: var(--sans);
    cursor: pointer;
    font-weight: 600;
    min-height: 44px;
  }

  /* ----- Stats row ----- */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 22px;
  }
  .stat {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 8px;
    text-align: center;
  }
  .stat .num {
    font-family: var(--sans);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .stat .lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-mute);
    margin-top: 4px;
  }

  /* ----- Filter tabs ----- */
  .tabs {
    display: flex; gap: 6px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: var(--radius-pill);
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 500;
    font-family: var(--sans);
    cursor: pointer;
    white-space: nowrap;
    min-height: 40px;
  }
  .tab.active {
    background: var(--ink); color: var(--bg); border-color: var(--ink);
  }

  /* ----- Defect list ----- */
  .defect-list { display: flex; flex-direction: column; gap: 10px; }
  .defect {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  .defect-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .defect-title {
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.3;
    flex: 1;
  }
  .defect-meta {
    display: flex; gap: 12px; flex-wrap: wrap;
    font-size: 13px;
    color: var(--ink-mute);
  }
  .defect-meta span { display: flex; align-items: center; gap: 4px; }
  .defect-thumbs {
    display: flex; gap: 6px; margin-top: 10px;
  }
  .thumb {
    width: 56px; height: 56px;
    border-radius: 8px;
    background: var(--line);
    object-fit: cover;
    border: 1px solid var(--line);
  }
  .thumb-more {
    width: 56px; height: 56px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px dashed var(--line);
    display: grid; place-items: center;
    font-size: 11px;
    color: var(--ink-mute);
  }
  .voice-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    padding: 3px 8px;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .status-pill {
    display: inline-flex; align-items: center;
    border-radius: var(--radius-pill);
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .status-pill.open { background: #e0e7ff; color: #3730a3; }
  .status-pill.in-progress { background: #fef3c7; color: #92400e; }
  .status-pill.final-punch-list { background: #fce7f3; color: #9d174d; }
  .status-pill.closed { background: #d1fae5; color: #065f46; }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-mute);
  }
  .empty-state .icon {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.5;
  }
  .empty-state p { margin: 4px 0; font-size: 14px; }

  /* ----- FAB ----- */
  .fab {
    position: fixed;
    right: 18px;
    bottom: calc(88px + env(safe-area-inset-bottom));
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--bg);
    border: none;
    box-shadow: 0 8px 24px rgba(2,6,23,0.3);
    cursor: pointer;
    z-index: 40;
    display: grid; place-items: center;
    font-size: 32px;
    font-weight: 300;
    line-height: 1;
  }
  .fab:active { transform: scale(0.95); }

  /* ----- Bottom nav ----- */
  .botnav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-elev);
    border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(3, 1fr);
    z-index: 30;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-item {
    background: none; border: none;
    padding: 16px 8px 14px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-mute);
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    cursor: pointer;
    min-height: 56px;
  }
  .nav-item.active { color: var(--ink); font-weight: 600; }
  .nav-icon { font-size: 22px; line-height: 1; }

  /* ----- Modal / sheet ----- */
  .sheet-back {
    position: fixed; inset: 0;
    background: rgba(2,6,23,0.5);
    z-index: 100;
    display: none;
    align-items: flex-end;
    backdrop-filter: blur(4px);
  }
  .sheet-back.show { display: flex; }
  .sheet {
    background: var(--bg);
    width: 100%;
    max-height: 92vh;
    max-height: 92dvh;
    border-radius: 24px 24px 0 0;
    overflow-y: auto;
    padding: 0 0 calc(24px + env(safe-area-inset-bottom));
    animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 10px auto 4px;
  }
  .sheet-head {
    padding: 12px 20px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0;
    background: var(--bg);
    z-index: 2;
  }
  .sheet-title {
    font-family: var(--sans);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.015em;
  }
  .close-x {
    background: none; border: none;
    font-size: 30px;
    color: var(--ink-mute);
    cursor: pointer;
    padding: 8px 12px;
    line-height: 1;
    min-width: 44px;
    min-height: 44px;
  }
  .sheet-body { padding: 20px; }

  /* ----- Form ----- */
  .field { margin-bottom: 20px; }
  .field-label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-mute);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .field-input,
  .field-select,
  .field-textarea {
    width: 100%;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 16px 14px;
    font-family: var(--sans);
    font-size: 16px;
    color: var(--ink);
    -webkit-appearance: none;
    appearance: none;
    min-height: 50px;
  }
  .field-textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
  .field-input:focus,
  .field-select:focus,
  .field-textarea:focus {
    outline: none;
    border-color: var(--ink);
  }
  .field-select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%238a8270' d='M6 8L0 0h12z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
  }
  .seg-btn {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 11px 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--ink);
    font-family: var(--sans);
  }

  .quick-pick {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 10px;
  }
  .quick-pick button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: var(--radius-pill);
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--sans);
    transition: all 0.15s ease;
    min-height: 40px;
  }
  .quick-pick button.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .quick-pick button:not(.active):active { background: var(--bg); }

  /* ----- Photo capture ----- */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 6px;
  }
  .photo-cell {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    background: var(--line);
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .photo-cell img { width: 100%; height: 100%; object-fit: cover; }
  .photo-cell.add {
    background: var(--bg-elev);
    border: 2px dashed var(--line);
    display: grid; place-items: center;
    color: var(--ink-mute);
    font-size: 13px;
  }
  .photo-cell .remove {
    position: absolute; top: 4px; right: 4px;
    background: rgba(2,6,23,0.85);
    color: white;
    border: none;
    border-radius: 50%;
    width: 30px; height: 30px;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
  .photo-cell .annotated-badge {
    position: absolute; bottom: 4px; left: 4px;
    background: var(--ok);
    color: white;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  /* ----- Per-photo captions ----- */
  .photo-captions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .photo-caption-row {
    display: flex; gap: 10px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px;
    align-items: stretch;
  }
  .photo-caption-thumb {
    width: 64px; height: 64px;
    border-radius: 8px;
    background: var(--line);
    object-fit: cover;
    flex-shrink: 0;
  }
  .photo-caption-body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .photo-caption-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-mute);
    font-weight: 600;
  }
  .photo-caption-input {
    width: 100%;
    border: none;
    background: transparent;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink);
    padding: 4px 0;
    resize: none;
    line-height: 1.4;
    min-height: 36px;
  }
  .photo-caption-input:focus { outline: none; }
  .photo-caption-input::placeholder { color: var(--ink-mute); font-style: italic; }

  /* ----- Photo source chooser ----- */
  .photo-source-btn {
    width: 100%;
    display: flex; align-items: center; gap: 14px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 10px;
    cursor: pointer;
    text-align: left;
    font-family: var(--sans);
    color: var(--ink);
  }
  .photo-source-btn:active { background: var(--bg); }
  .photo-source-icon {
    font-size: 28px;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: var(--bg);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .photo-source-label { display: flex; flex-direction: column; gap: 2px; }
  .photo-source-label strong { font-size: 15px; font-weight: 600; }
  .photo-source-label span { font-size: 12px; color: var(--ink-mute); }

  /* ----- Voice recorder ----- */
  .voice-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
  }
  .rec-btn {
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 50%;
    width: 44px; height: 44px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    display: grid; place-items: center;
  }
  .rec-btn.recording {
    background: var(--danger);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(185,28,28,0.5); }
    50% { box-shadow: 0 0 0 10px rgba(185,28,28,0); }
  }
  .voice-status {
    flex: 1;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .voice-status .time {
    font-family: var(--sans);
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .voice-list {
    margin-top: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .voice-item {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    display: flex; align-items: center; gap: 10px;
    font-size: 12px;
  }
  .voice-item button {
    background: var(--ink); color: var(--bg);
    border: none; border-radius: 50%;
    width: 28px; height: 28px;
    cursor: pointer;
    font-size: 11px;
  }
  .voice-item .del {
    background: transparent; color: var(--ink-mute);
    margin-left: auto;
    font-size: 16px;
  }

  /* ----- Action buttons ----- */
  .actions {
    display: flex; gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--line);
    background: var(--bg);
    position: sticky; bottom: 0;
  }
  .btn {
    flex: 1;
    padding: 17px;
    border-radius: var(--radius-pill);
    border: none;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    min-height: 52px;
  }
  .btn-primary { background: var(--ink); color: var(--bg); }
  .btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid #fecaca; }

  /* ----- Annotation canvas ----- */
  .annotate-overlay {
    position: fixed; inset: 0;
    background: #000;
    z-index: 200;
    display: none;
    flex-direction: column;
  }
  .annotate-overlay.show { display: flex; }
  .annotate-bar {
    background: rgba(0,0,0,0.85);
    color: white;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .annotate-bar button {
    background: rgba(255,255,255,0.1);
    color: white;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: var(--radius-pill);
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: var(--sans);
  }
  .annotate-bar button.active {
    background: white; color: black;
  }
  .annotate-bar .spacer { flex: 1; }
  .annotate-canvas-wrap {
    flex: 1;
    overflow: hidden;
    display: grid; place-items: center;
    background: #000;
    position: relative;
  }
  #annotateCanvas {
    max-width: 100%; max-height: 100%;
    touch-action: none;
  }
  .color-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    cursor: pointer;
  }
  .color-dot.active { border-color: white; transform: scale(1.15); }

  /* ----- Toast ----- */
  .toast {
    position: fixed;
    bottom: calc(100px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 12px 20px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    z-index: 300;
    box-shadow: 0 8px 24px rgba(2,6,23,0.3);
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* ----- Settings ----- */
  .setting-row {
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-row label { display: block; font-size: 12px; color: var(--ink-mute); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>

<div class="topbar">

  <div class="topbar-right">

      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText">Ready</span>
    </div>
  </div>
</div>

<main class="page" id="page">
  <!-- Page content swapped by view -->
</main>

<button class="fab" id="fab" aria-label="Add defect">+</button>

<nav class="botnav">
  <button class="nav-item active" data-view="list">
    <span class="nav-icon">⊞</span>
    <span>Punch List</span>
  </button>
  <button class="nav-item" data-view="report">
    <span class="nav-icon">↗</span>

  </button>
  <button class="nav-item" data-view="settings">
    <span class="nav-icon">⚙</span>
    <span>Settings</span>
  </button>
</nav>

<!-- Defect form sheet -->
<div class="sheet-back" id="defectSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title" id="defectSheetTitle">New Defect</div>
      <button class="close-x" data-close>×</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label class="field-label">Location</label>
        <input type="text" class="field-input" id="dLocation" placeholder="Building A, 2nd Floor, Room 204" autocomplete="off" />
      </div>

      <div class="field">
        <label class="field-label">Trade</label>
        <select class="field-select" id="dTrade">
          <option value="">Select trade…</option>
          <option>Cabinetry / Millwork</option>
          <option>Drywall</option>
          <option>Electrical</option>
          <option>Flooring</option>
          <option>Foundation</option>
          <option>Framing</option>
          <option>HVAC</option>
          <option>Insulation</option>
          <option>Landscaping</option>
          <option>Painting</option>
          <option>Plumbing</option>
          <option>Roofing</option>
          <option>Siding</option>
          <option>Tile</option>
          <option>Windows / Doors</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label">Status</label>
        <select class="field-select" id="dStatus">
          <option value="Open">Open</option>
          <option value="In Progress">In Progress</option>
          <option value="Final Punch List">Final Punch List</option>
          <option value="Closed">Closed</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label">Description</label>
        <textarea class="field-textarea" id="dDesc" placeholder="Brief description of the defect"></textarea>
        <div class="quick-pick" id="quickPick"></div>
      </div>

      <div class="field">
        <label class="field-label">Responsible Party</label>
        <input type="text" class="field-input" id="dResp" placeholder="Subcontractor or trade name" />
      </div>

      <div class="field">
        <label class="field-label">Due Date</label>
        <input type="date" class="field-input" id="dDue" />
      </div>

      <div class="field">
        <label class="field-label">Photos</label>
        <div class="photo-grid" id="photoGrid"></div>
        <div class="photo-captions" id="photoCaptions"></div>
        <input type="file" accept="image/*" capture="environment" id="photoInputCamera" hidden />
        <input type="file" accept="image/*" id="photoInputGallery" hidden multiple />
      </div>

      <div class="field">
        <label class="field-label">Voice Notes</label>
        <div class="voice-row">
          <button type="button" class="rec-btn" id="recBtn">●</button>
          <div class="voice-status">
            <div id="recStatus">Tap to record</div>
            <div class="time" id="recTime" style="display:none;">00:00</div>
          </div>
        </div>
        <div class="voice-list" id="voiceList"></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-danger" id="btnDelete" style="display:none;">Delete</button>
      <button class="btn btn-secondary" data-close>Cancel</button>
      <button class="btn btn-primary" id="btnSave">Save Defect</button>
    </div>
  </div>
</div>

<!-- Photo annotation overlay -->
<div class="annotate-overlay" id="annotateOverlay">
  <div class="annotate-bar">
    <button id="annoCancel">Cancel</button>
    <div class="spacer"></div>
    <div class="color-dot active" data-color="#ef4444" style="background:#ef4444;"></div>
    <div class="color-dot" data-color="#fbbf24" style="background:#fbbf24;"></div>
    <div class="color-dot" data-color="#3b82f6" style="background:#3b82f6;"></div>
    <div class="color-dot" data-color="#ffffff" style="background:#fff;"></div>
    <div class="spacer"></div>
    <button id="annoUndo">Undo</button>
    <button id="annoSave" class="active">Save</button>
  </div>
  <div class="annotate-canvas-wrap">
    <canvas id="annotateCanvas"></canvas>
  </div>
</div>

<!-- Project picker sheet -->
<div class="sheet-back" id="projectSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title">Select Project</div>
      <button class="close-x" data-close>×</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label class="field-label">Project Name</label>
        <input type="text" class="field-input" id="projectInput" placeholder="e.g. Alexander, Foundation Site, etc." />
      </div>
      <div class="field">
        <label class="field-label">Recent Projects</label>
        <div id="recentProjects" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" data-close>Cancel</button>
      <button class="btn btn-primary" id="btnSetProject">Use Project</button>
    </div>
  </div>
</div>

<!-- Photo source chooser sheet -->
<div class="sheet-back" id="photoChooser">

    <div class="sheet-head">

        <span class="photo-source-label">
          <strong>Choose from Gallery</strong>
          <span>Pick existing photo(s)</span>
        </span>
      </button>
    </div>
  </div>
</div>

const DB_NAME = 'av-inspector';
const DB_VER = 1;
let _db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (_db) return resolve(_db);
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('defects')) {
        const store = db.createObjectStore('defects', { keyPath: 'id' });
        store.createIndex('project', 'project', { unique: false });
        store.createIndex('createdAt', 'createdAt', { unique: false });
      }
      if (!db.objectStoreNames.contains('settings')) {
        db.createObjectStore('settings', { keyPath: 'key' });
      }
    };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(store, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete = () => resolve(value);
    tx.onerror = () => reject(tx.error);
  });
}
async function dbGet(store, key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbAll(store) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function dbDelete(store, key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function blobToDataUrl(blob) {
  return new Promise((resolve) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.readAsDataURL(blob);
  });
}

// Compress an image File/Blob, preserve orientation. Cap longer edge at 2000px (print-friendly).
async function compressImage(file) {
  const dataUrl = await blobToDataUrl(file);
  const img = new Image();
  await new Promise((res) => { img.onload = res; img.src = dataUrl; });
  const maxEdge = 2000;
  const longer = Math.max(img.width, img.height);
  const scale = Math.min(1, maxEdge / longer);
  const w = Math.round(img.width * scale);
  const h = Math.round(img.height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.88);
  const blob = await (await fetch(compressedDataUrl)).blob();
  const orientation = h > w ? 'portrait' : 'landscape';
  return { blob, dataUrl: compressedDataUrl, orientation, width: w, height: h };
}

// ---------- GPS ----------
function getGPS() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy
      }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 5000, maximumAge: 30000 }
    );
  });
}

// Quick picks behave as toggles: tap = add line to description; tap again = remove line.
// We detect which picks are currently in the description by exact-line match.
function getActivePicks() {
  const text = $('#dDesc').value || '';
  return new Set(text.split('\n').map(l => l.trim()).filter(Boolean));
}

function renderQuickPicks() {
  const trade = $('#dTrade').value;
  const picks = trade && QUICK_PICKS_BY_TRADE[trade] ? QUICK_PICKS_BY_TRADE[trade] : QUICK_PICKS_DEFAULT;
  const active = getActivePicks();
  $('#quickPick').innerHTML = picks.map(p => {
    const isActive = active.has(p);
    return `<button type="button" class="${isActive ? 'active' : ''}" data-pick="${escapeHtml(p)}">${isActive ? '✓ ' : ''}${escapeHtml(p)}</button>`;
  }).join('');
  $$('#quickPick button').forEach(b => {
    b.onclick = () => togglePick(b.dataset.pick);
  });
}

function togglePick(pick) {
  const ta = $('#dDesc');
  const lines = (ta.value || '').split('\n');
  const idx = lines.findIndex(l => l.trim() === pick);
  if (idx >= 0) {
    // Remove this line
    lines.splice(idx, 1);
  } else {
    // Append on its own line. Strip empty trailing lines first.
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    lines.push(pick);
  }
  ta.value = lines.join('\n').replace(/\n{3,}/g, '\n\n');
  renderQuickPicks();
}

const annoState = { ctx: null, color: '#ef4444', strokes: [], idx: -1, base: null };

function openAnnotate(idx) {
  annoState.idx = idx;
  annoState.strokes = [];
  annoState.color = '#ef4444';
  $$('#annotateOverlay .color-dot').forEach((d, i) => {
    d.classList.toggle('active', i === 0);
  });

  const img = new Image();
  img.onload = () => {
    annoState.base = img;
    const canvas = $('#annotateCanvas');
    const wrap = canvas.parentElement;
    const maxW = wrap.clientWidth;
    const maxH = wrap.clientHeight;
    const scale = Math.min(maxW / img.width, maxH / img.height, 1);
    canvas.width = img.width;
    canvas.height = img.height;
    canvas.style.width = (img.width * scale) + 'px';
    canvas.style.height = (img.height * scale) + 'px';
    annoState.ctx = canvas.getContext('2d');
    redrawAnno();
  };
  img.src = state.photos[idx].dataUrl;

  $('#annotateOverlay').classList.add('show');
}

function redrawAnno() {
  const ctx = annoState.ctx;
  const canvas = $('#annotateCanvas');
  ctx.drawImage(annoState.base, 0, 0);
  for (const stroke of annoState.strokes) {
    ctx.strokeStyle = stroke.color;
    ctx.lineWidth = Math.max(canvas.width / 200, 4);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    stroke.points.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
  }
}

(function setupAnnoCanvas() {
  const canvas = $('#annotateCanvas');
  let drawing = false;
  let current = null;

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const x = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) * (canvas.width / r.width);
    const y = ((e.touches ? e.touches[0].clientY : e.clientY) - r.top) * (canvas.height / r.height);
    return { x, y };
  }

  function start(e) {
    e.preventDefault();
    drawing = true;
    current = { color: annoState.color, points: [pos(e)] };
    annoState.strokes.push(current);
    redrawAnno();
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    current.points.push(pos(e));
    redrawAnno();
  }
  function end() { drawing = false; current = null; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
})();

$$('#annotateOverlay .color-dot').forEach(d => {
  d.onclick = () => {
    $$('#annotateOverlay .color-dot').forEach(x => x.classList.remove('active'));
    d.classList.add('active');
    annoState.color = d.dataset.color;
  };
});
$('#annoUndo').onclick = () => { annoState.strokes.pop(); redrawAnno(); };
$('#annoCancel').onclick = () => $('#annotateOverlay').classList.remove('show');
$('#annoSave').onclick = async () => {
  const canvas = $('#annotateCanvas');
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  const blob = await (await fetch(dataUrl)).blob();
  state.photos[annoState.idx] = {
    ...state.photos[annoState.idx],
    blob, dataUrl, annotated: annoState.strokes.length > 0
  };
  $('#annotateOverlay').classList.remove('show');
  renderPhotoGrid();
};

// ---------- Voice recorder ----------
$('#recBtn').onclick = async () => {
  if (state.rec.mediaRec && state.rec.mediaRec.state === 'recording') {
    stopRecording();
  } else {
    await startRecording();
  }
};

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(stream);
    state.rec.mediaRec = mr;
    state.rec.chunks = [];
    state.rec.startedAt = Date.now();

    mr.ondataavailable = (e) => state.rec.chunks.push(e.data);
    mr.onstop = async () => {
      const blob = new Blob(state.rec.chunks, { type: 'audio/webm' });
      const dataUrl = await blobToDataUrl(blob);
      const durationSec = Math.round((Date.now() - state.rec.startedAt) / 1000);
      state.voices.push({ id: uid(), blob, dataUrl, durationSec });
      stream.getTracks().forEach(t => t.stop());
      renderVoiceList();
      $('#recBtn').classList.remove('recording');
      $('#recStatus').textContent = 'Tap to record';
      $('#recTime').style.display = 'none';
      clearInterval(state.rec.timer);
    };

    mr.start();
    $('#recBtn').classList.add('recording');
    $('#recStatus').textContent = 'Recording…';
    $('#recTime').style.display = 'block';
    state.rec.timer = setInterval(() => {
      const sec = Math.floor((Date.now() - state.rec.startedAt) / 1000);
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      $('#recTime').textContent = `${m}:${s}`;
    }, 200);
  } catch (err) {
    toast('Microphone access denied');
    console.error(err);
  }
}

function stopRecording() {
  if (state.rec.mediaRec) state.rec.mediaRec.stop();
}

function renderVoiceList() {
  $('#voiceList').innerHTML = state.voices.map((v, i) => `
    <div class="voice-item">
      <button data-play="${i}">▶</button>
      <span>Voice note ${i + 1} · ${v.durationSec}s</span>
      <button class="del" data-rmv="${i}">×</button>
    </div>
  `).join('');
  $$('#voiceList [data-play]').forEach(b => {
    b.onclick = () => {
      const audio = new Audio(state.voices[Number(b.dataset.play)].dataUrl);
      audio.play();
    };
  });
  $$('#voiceList [data-rmv]').forEach(b => {
    b.onclick = () => {
      state.voices.splice(Number(b.dataset.rmv), 1);
      renderVoiceList();
    };
  });
}

// ---------- Save defect ----------
$('#btnSave').onclick = async () => {
  const desc = $('#dDesc').value.trim();
  if (!desc) { toast('Enter a description'); return; }
  if (!state.project) { toast('Select a project first'); openProjectPicker(); return; }

  const gps = await getGPS();

  const defect = {
    id: state.editingId || uid(),
    project: state.project,
    location: $('#dLocation').value.trim(),
    trade: $('#dTrade').value,
    description: desc,
    responsible: $('#dResp').value.trim(),
    dueDate: $('#dDue').value,
    photos: state.photos,
    voices: state.voices,
    gps,
    status: $('#dStatus').value || 'Open',
    createdAt: state.editingId ? (await dbGet('defects', state.editingId))?.createdAt || new Date().toISOString() : new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  await dbPut('defects', defect);
  $('#defectSheet').classList.remove('show');
  toast(state.editingId ? 'Defect updated' : 'Defect saved');
  state.editingId = null;
  renderList();
};

$('#btnDelete').onclick = async () => {
  if (!state.editingId) return;
  if (!confirm('Delete this defect?')) return;
  await dbDelete('defects', state.editingId);
  $('#defectSheet').classList.remove('show');
  state.editingId = null;
  toast('Defect deleted');
  renderList();
};

// ---------- PDF ----------
async function buildPDF(defects, inspectorName) {
  const { jsPDF } = window.jspdf;

  // Default portrait letter; we'll set per-page orientation when adding pages.
  const pdf = new jsPDF({ unit: 'pt', format: 'letter', orientation: 'portrait' });
  const M = 48;
  const HEADER_H = 52;

  // ---- Brand header drawn on every page ----
  function drawBrandHeader(page, w, projectName) {
    page.setFillColor(2, 6, 23);
    page.rect(0, 0, w, HEADER_H, 'F');

    // Real Amin Ventures logo (square, mark + wordmark on black bg)
    const logoSize = 40;
    const logoX = M;
    const logoY = 6;
    try {
      page.addImage(AV_LOGO_DATA_URL, 'JPEG', logoX, logoY, logoSize, logoSize, undefined, 'FAST');
    } catch (e) {
      page.setDrawColor(245, 240, 230);
      page.setLineWidth(1.6);
      page.line(logoX, logoY + 32 * 0.20, logoX, logoY + 32);
      page.line(logoX, logoY + 32 * 0.20, logoX + 16, logoY);
      page.line(logoX + 16, logoY, logoX + 16, logoY + 32);
    }

    // Right side: project name + date
    if (projectName) {
      page.setTextColor(180, 170, 150);
      page.setFont('helvetica', 'normal');
      page.setFontSize(8);
      page.text(`PROJECT · ${String(projectName).toUpperCase()}`, w - M, 24, { align: 'right' });
      page.setTextColor(245, 240, 230);
      page.setFontSize(10);
      page.setFont('helvetica', 'bold');
      page.text(new Date().toLocaleDateString(), w - M, 40, { align: 'right' });
    }
  }

  function drawFooter(page, w, h, label) {
    page.setTextColor(160, 150, 130);
    page.setFont('helvetica', 'normal');
    page.setFontSize(7);
    page.text(label || 'Amin Ventures · Field Inspection Report', M, h - 14);
    const pageNum = page.internal.getCurrentPageInfo().pageNumber;
    page.text(`Page ${pageNum}`, w - M, h - 14, { align: 'right' });
  }

  // Build a flat list: one entry per photo. Defects with no photos still
  // get one info-only page so nothing is lost.
  const photoPages = [];
  let defectIndex = 0;
  for (const d of defects) {
    defectIndex++;
    const photos = d.photos || [];
    if (photos.length === 0) {
      photoPages.push({ d, photo: null, defectIndex, photoIdx: 0, photoTotal: 0 });
    } else {
      photos.forEach((p, i) => {
        photoPages.push({ d, photo: p, defectIndex, photoIdx: i, photoTotal: photos.length });
      });
    }
  }

  // Render each entry as its own page. Pages are always portrait; the photo
  // is fitted (with its real aspect ratio preserved) into the available zone.
  let firstPage = true;
  for (const entry of photoPages) {
    const { d, photo, defectIndex, photoIdx, photoTotal } = entry;

    if (firstPage) {
      // jsPDF already created a portrait page 1 — use it
      firstPage = false;
    } else {
      pdf.addPage('letter', 'portrait');
    }

    const pw = 612;   // letter portrait width
    const ph = 792;   // letter portrait height

    drawBrandHeader(pdf, pw, d.project || state.project);

    // ----- Layout zones -----
    // Header band: 0 — HEADER_H
    // Photo zone: HEADER_H + 16 ... ph - META_BLOCK_H - 16
    // Meta block: bottom of page
    const META_BLOCK_H = 150;
    const photoTop = HEADER_H + 16;
    const photoBottom = ph - META_BLOCK_H - 12;
    const photoLeft = M;
    const photoRight = pw - M;
    const availableW = photoRight - photoLeft;
    const availableH = photoBottom - photoTop;

    // ----- Photo (if present) -----
    if (photo) {
      // Use real photo dimensions if available; default sensibly if not.
      let imgW = photo.width || 1500;
      let imgH = photo.height || 1500;
      const aspect = imgW / imgH;
      let drawW, drawH;
      if (availableW / availableH > aspect) {
        // Photo is taller than the zone allows for its width — fit by height
        drawH = availableH;
        drawW = drawH * aspect;
      } else {
        // Photo is wider — fit by width
        drawW = availableW;
        drawH = drawW / aspect;
      }
      const drawX = photoLeft + (availableW - drawW) / 2;
      const drawY = photoTop + (availableH - drawH) / 2;

      try {
        pdf.addImage(photo.dataUrl, 'JPEG', drawX, drawY, drawW, drawH, undefined, 'FAST');
      } catch (e) {
        console.error('photo page image fail', e);
      }

      if (photo.annotated) {
        pdf.setFillColor(22, 101, 52);
        pdf.roundedRect(drawX + 8, drawY + 8, 70, 18, 4, 4, 'F');
        pdf.setTextColor(255, 255, 255);
        pdf.setFont('helvetica', 'bold');
        pdf.setFontSize(8);
        pdf.text('MARKED UP', drawX + 43, drawY + 20, { align: 'center' });
      }
    } else {
      // No photo: just an info card centered in the photo zone
      pdf.setFillColor(245, 240, 230);
      pdf.roundedRect(photoLeft + availableW * 0.15, photoTop + availableH * 0.30,
                       availableW * 0.70, availableH * 0.40, 12, 12, 'F');
      pdf.setTextColor(120, 110, 90);
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(10);
      pdf.text('(No photo attached for this entry)', pw / 2, photoTop + availableH * 0.55, { align: 'center' });
    }

    // ----- Bottom metadata block -----
    const blockY = ph - META_BLOCK_H;
    pdf.setFillColor(245, 240, 230);
    pdf.rect(0, blockY, pw, META_BLOCK_H, 'F');
    pdf.setDrawColor(228, 220, 203);
    pdf.setLineWidth(0.5);
    pdf.line(0, blockY, pw, blockY);

    // Top row: DEFECT 001 · PHOTO 2 OF 4 on the left, STATUS on right
    pdf.setTextColor(120, 110, 90);
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(8);
    const indicator = photoTotal > 0
      ? `DEFECT ${String(defectIndex).padStart(3, '0')}  ·  PHOTO ${photoIdx + 1} OF ${photoTotal}`
      : `DEFECT ${String(defectIndex).padStart(3, '0')}`;
    pdf.text(indicator, M, blockY + 18);

    // Status pill on right
    const status = d.status || 'Open';
    const stColor = status === 'Closed' ? [6, 95, 70]
      : status === 'Final Punch List' ? [157, 23, 77]
      : status === 'In Progress' ? [146, 64, 14]
      : [55, 48, 163];
    pdf.setFillColor(...stColor);
    const stText = status.toUpperCase();
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(8);
    const stWidth = pdf.getTextWidth(stText) + 18;
    pdf.roundedRect(pw - M - stWidth, blockY + 8, stWidth, 16, 8, 8, 'F');
    pdf.setTextColor(255, 255, 255);
    pdf.text(stText, pw - M - stWidth / 2, blockY + 18, { align: 'center' });

    // Description (large, bold)
    const rawCaption = (photo && photo.caption && photo.caption.trim())
      ? photo.caption.trim()
      : (d.description || 'Untitled');
    const flatCaption = rawCaption.replace(/[\r\n\t]+/g, ' · ').replace(/\s+/g, ' ').trim();
    pdf.setTextColor(2, 6, 23);
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(14);
    const titleLines = pdf.splitTextToSize(flatCaption, pw - 2 * M);
    pdf.text(titleLines.slice(0, 2), M, blockY + 42);

    // Three-column meta row: LOCATION  ·  TRADE  ·  RESPONSIBLE
    const colY = blockY + 86;
    const colW = (pw - 2 * M) / 3;
    const drawMeta = (label, value, x) => {
      pdf.setTextColor(120, 110, 90);
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(7);
      pdf.text(label.toUpperCase(), x, colY);
      pdf.setTextColor(2, 6, 23);
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(11);
      const vLines = pdf.splitTextToSize(String(value || '—'), colW - 14);
      pdf.text(vLines.slice(0, 2), x, colY + 14);
    };
    drawMeta('Location', d.location || '—', M);
    drawMeta('Trade', d.trade || '—', M + colW);
    drawMeta('Responsible', d.responsible || '—', M + colW * 2);

    drawFooter(pdf, pw, ph,
      `Amin Ventures · ${state.project || 'Field Inspection'} · ${inspectorName || ''}`.trim());
  }

  return pdf;
}

// ---------- Email ----------
async function sendEmail(defects, inspectorName, recipient) {
  toast('Generating PDF…');
  const pdf = await buildPDF(defects, inspectorName);
  const filename = `punchlist-${(state.project || 'report').replace(/\s+/g,'_')}-${Date.now()}.pdf`;

  // Save the PDF locally so the inspector has a copy
  pdf.save(filename);

  const subject = `Punch List — ${state.project || 'Inspection'} — ${new Date().toLocaleDateString()}`;
  const body = `Hello,

Attached is the punch list report for ${state.project || 'the project'}.

Summary:
• Total defects: ${defects.length}
• Open: ${defects.filter(d => (d.status || 'Open') === 'Open').length}
• In Progress: ${defects.filter(d => d.status === 'In Progress').length}
• Final Punch List: ${defects.filter(d => d.status === 'Final Punch List').length}
• Closed: ${defects.filter(d => d.status === 'Closed').length}

Inspector: ${inspectorName || '—'}
Date: ${new Date().toLocaleString()}

** Important: The PDF was downloaded to this device. Please attach "${filename}" from your Downloads folder before sending.

Generated by AV Inspector.`;

  // mailto: cannot attach files (browser security). The PDF is saved to Downloads;
  // the user attaches it manually. This is the only reliable, offline-first path.
  const mailto = `mailto:${encodeURIComponent(recipient)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = mailto;

  setTimeout(() => {
    toast('PDF saved to Downloads — attach it to the email');
  }, 1500);
}
