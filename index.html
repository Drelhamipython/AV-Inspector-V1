<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#020617" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AV Inspector" />
<link rel="manifest" href="./manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<title>AV Inspector — Punch List</title>
<style>
  :root {
    --bg: #f5f0e6;
    --bg-elev: #ffffff;
    --ink: #020617;
    --ink-soft: #4a4538;
    --ink-mute: #8a8270;
    --line: #e4dccb;
    --accent: #020617;
    --danger: #b91c1c;
    --warn: #c2410c;
    --ok: #166534;
    --critical: #991b1b;
    --major: #c2410c;
    --minor: #ca8a04;
    --shadow: 0 1px 2px rgba(2,6,23,.04), 0 4px 16px rgba(2,6,23,.06);
    --radius: 14px;
    --radius-sm: 10px;
    --radius-pill: 999px;
    --serif: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: var(--sans);
    color: var(--ink);
    background: var(--bg);
    overscroll-behavior-y: contain;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ----- Top bar ----- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--ink);
    color: var(--bg);
    padding: calc(env(safe-area-inset-top) + 14px) 20px 14px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 26px; height: 26px;
    display: grid; place-items: center;
  }
  .brand-mark svg { width: 100%; height: 100%; display: block; }
  .brand-name {
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.24em;
    font-weight: 600;
  }
  .topbar-right { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .sync-badge {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius-pill);
    padding: 5px 11px;
    font-size: 11px;
    letter-spacing: 0.04em;
    display: flex; align-items: center; gap: 6px;
  }
  .sync-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #4ade80;
  }
  .sync-dot.pending { background: #fbbf24; }
  .sync-dot.offline { background: #94a3b8; }

  /* ----- Page header ----- */
  .page {
    padding: 24px 20px 120px;
    max-width: 720px;
    margin: 0 auto;
  }
  .page-title {
    font-family: var(--sans);
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.05;
    margin: 8px 0 6px;
  }
  .page-sub {
    color: var(--ink-mute);
    font-size: 14px;
    margin: 0 0 20px;
  }

  /* ----- Project picker ----- */
  .project-card {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 18px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    box-shadow: var(--shadow);
  }
  .project-card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-mute);
    margin-bottom: 4px;
  }
  .project-card .value {
    font-family: var(--sans);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.015em;
  }
  .project-card .value.empty { color: var(--ink-mute); font-style: italic; }
  .icon-btn {
    background: var(--ink); color: var(--bg);
    border: none; border-radius: var(--radius-pill);
    padding: 10px 16px;
    font-size: 13px;
    font-family: var(--sans);
    cursor: pointer;
    font-weight: 500;
  }

  /* ----- Stats row ----- */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 22px;
  }
  .stat {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 8px;
    text-align: center;
  }
  .stat .num {
    font-family: var(--sans);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .stat .lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-mute);
    margin-top: 4px;
  }
  .stat.crit .num { color: var(--critical); }
  .stat.maj .num { color: var(--major); }
  .stat.min .num { color: var(--minor); }

  /* ----- Filter tabs ----- */
  .tabs {
    display: flex; gap: 6px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: var(--radius-pill);
    padding: 7px 14px;
    font-size: 13px;
    font-family: var(--sans);
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--ink); color: var(--bg); border-color: var(--ink);
  }

  /* ----- Defect list ----- */
  .defect-list { display: flex; flex-direction: column; gap: 10px; }
  .defect {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  .defect-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .defect-title {
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.3;
    flex: 1;
  }
  .badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 4px 9px;
    border-radius: var(--radius-pill);
    font-weight: 600;
    flex-shrink: 0;
  }
  .badge.critical { background: #fee2e2; color: var(--critical); }
  .badge.major { background: #ffedd5; color: var(--major); }
  .badge.minor { background: #fef9c3; color: var(--minor); }
  .defect-meta {
    display: flex; gap: 10px; flex-wrap: wrap;
    font-size: 12px;
    color: var(--ink-mute);
  }
  .defect-meta span { display: flex; align-items: center; gap: 4px; }
  .defect-thumbs {
    display: flex; gap: 6px; margin-top: 10px;
  }
  .thumb {
    width: 56px; height: 56px;
    border-radius: 8px;
    background: var(--line);
    object-fit: cover;
    border: 1px solid var(--line);
  }
  .thumb-more {
    width: 56px; height: 56px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px dashed var(--line);
    display: grid; place-items: center;
    font-size: 11px;
    color: var(--ink-mute);
  }
  .voice-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    padding: 3px 8px;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .status-pill {
    display: inline-flex; align-items: center;
    border-radius: var(--radius-pill);
    padding: 3px 9px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .status-pill.open { background: #e0e7ff; color: #3730a3; }
  .status-pill.in-progress { background: #fef3c7; color: #92400e; }
  .status-pill.final-punch-list { background: #fce7f3; color: #9d174d; }
  .status-pill.closed { background: #d1fae5; color: #065f46; }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-mute);
  }
  .empty-state .icon {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.5;
  }
  .empty-state p { margin: 4px 0; font-size: 14px; }

  /* ----- FAB ----- */
  .fab {
    position: fixed;
    right: 20px;
    bottom: calc(80px + env(safe-area-inset-bottom));
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--bg);
    border: none;
    box-shadow: 0 8px 24px rgba(2,6,23,0.3);
    cursor: pointer;
    z-index: 40;
    display: grid; place-items: center;
    font-size: 28px;
    font-weight: 300;
    line-height: 1;
  }
  .fab:active { transform: scale(0.95); }

  /* ----- Bottom nav ----- */
  .botnav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-elev);
    border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(3, 1fr);
    z-index: 30;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-item {
    background: none; border: none;
    padding: 12px 8px 10px;
    font-family: var(--sans);
    font-size: 11px;
    color: var(--ink-mute);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer;
  }
  .nav-item.active { color: var(--ink); }
  .nav-icon { font-size: 18px; line-height: 1; }

  /* ----- Modal / sheet ----- */
  .sheet-back {
    position: fixed; inset: 0;
    background: rgba(2,6,23,0.5);
    z-index: 100;
    display: none;
    align-items: flex-end;
    backdrop-filter: blur(4px);
  }
  .sheet-back.show { display: flex; }
  .sheet {
    background: var(--bg);
    width: 100%;
    max-height: 92vh;
    max-height: 92dvh;
    border-radius: 24px 24px 0 0;
    overflow-y: auto;
    padding: 0 0 calc(24px + env(safe-area-inset-bottom));
    animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 10px auto 4px;
  }
  .sheet-head {
    padding: 12px 20px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0;
    background: var(--bg);
    z-index: 2;
  }
  .sheet-title {
    font-family: var(--sans);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.015em;
  }
  .close-x {
    background: none; border: none;
    font-size: 24px;
    color: var(--ink-mute);
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }
  .sheet-body { padding: 20px; }

  /* ----- Form ----- */
  .field { margin-bottom: 18px; }
  .field-label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-mute);
    margin-bottom: 7px;
    font-weight: 600;
  }
  .field-input,
  .field-select,
  .field-textarea {
    width: 100%;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    font-family: var(--sans);
    font-size: 15px;
    color: var(--ink);
    -webkit-appearance: none;
    appearance: none;
  }
  .field-textarea { resize: vertical; min-height: 80px; }
  .field-input:focus,
  .field-select:focus,
  .field-textarea:focus {
    outline: none;
    border-color: var(--ink);
  }
  .field-select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%238a8270' d='M6 8L0 0h12z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
  }
  .seg {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .seg-btn {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 11px 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--ink);
    font-family: var(--sans);
  }
  .seg-btn.active.crit { background: var(--critical); color: white; border-color: var(--critical); }
  .seg-btn.active.maj { background: var(--major); color: white; border-color: var(--major); }
  .seg-btn.active.min { background: var(--minor); color: white; border-color: var(--minor); }

  .quick-pick {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: 8px;
  }
  .quick-pick button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: var(--radius-pill);
    padding: 5px 11px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--sans);
  }
  .quick-pick button:active { background: var(--ink); color: var(--bg); }

  /* ----- Photo capture ----- */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 6px;
  }
  .photo-cell {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    background: var(--line);
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .photo-cell img { width: 100%; height: 100%; object-fit: cover; }
  .photo-cell.add {
    background: var(--bg-elev);
    border: 2px dashed var(--line);
    display: grid; place-items: center;
    color: var(--ink-mute);
    font-size: 13px;
  }
  .photo-cell .remove {
    position: absolute; top: 4px; right: 4px;
    background: rgba(2,6,23,0.7);
    color: white;
    border: none;
    border-radius: 50%;
    width: 22px; height: 22px;
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
  }
  .photo-cell .annotated-badge {
    position: absolute; bottom: 4px; left: 4px;
    background: var(--ok);
    color: white;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  /* ----- Photo source chooser ----- */
  .photo-source-btn {
    width: 100%;
    display: flex; align-items: center; gap: 14px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 10px;
    cursor: pointer;
    text-align: left;
    font-family: var(--sans);
    color: var(--ink);
  }
  .photo-source-btn:active { background: var(--bg); }
  .photo-source-icon {
    font-size: 28px;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: var(--bg);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .photo-source-label { display: flex; flex-direction: column; gap: 2px; }
  .photo-source-label strong { font-size: 15px; font-weight: 600; }
  .photo-source-label span { font-size: 12px; color: var(--ink-mute); }

  /* ----- Voice recorder ----- */
  .voice-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
  }
  .rec-btn {
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 50%;
    width: 44px; height: 44px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    display: grid; place-items: center;
  }
  .rec-btn.recording {
    background: var(--danger);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(185,28,28,0.5); }
    50% { box-shadow: 0 0 0 10px rgba(185,28,28,0); }
  }
  .voice-status {
    flex: 1;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .voice-status .time {
    font-family: var(--sans);
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .voice-list {
    margin-top: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .voice-item {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    display: flex; align-items: center; gap: 10px;
    font-size: 12px;
  }
  .voice-item button {
    background: var(--ink); color: var(--bg);
    border: none; border-radius: 50%;
    width: 28px; height: 28px;
    cursor: pointer;
    font-size: 11px;
  }
  .voice-item .del {
    background: transparent; color: var(--ink-mute);
    margin-left: auto;
    font-size: 16px;
  }

  /* ----- Action buttons ----- */
  .actions {
    display: flex; gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--line);
    background: var(--bg);
    position: sticky; bottom: 0;
  }
  .btn {
    flex: 1;
    padding: 14px;
    border-radius: var(--radius-pill);
    border: none;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--ink); color: var(--bg); }
  .btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid #fecaca; }

  /* ----- Annotation canvas ----- */
  .annotate-overlay {
    position: fixed; inset: 0;
    background: #000;
    z-index: 200;
    display: none;
    flex-direction: column;
  }
  .annotate-overlay.show { display: flex; }
  .annotate-bar {
    background: rgba(0,0,0,0.85);
    color: white;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .annotate-bar button {
    background: rgba(255,255,255,0.1);
    color: white;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: var(--radius-pill);
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: var(--sans);
  }
  .annotate-bar button.active {
    background: white; color: black;
  }
  .annotate-bar .spacer { flex: 1; }
  .annotate-canvas-wrap {
    flex: 1;
    overflow: hidden;
    display: grid; place-items: center;
    background: #000;
    position: relative;
  }
  #annotateCanvas {
    max-width: 100%; max-height: 100%;
    touch-action: none;
  }
  .color-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    cursor: pointer;
  }
  .color-dot.active { border-color: white; transform: scale(1.15); }

  /* ----- Toast ----- */
  .toast {
    position: fixed;
    bottom: calc(100px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 12px 20px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    z-index: 300;
    box-shadow: 0 8px 24px rgba(2,6,23,0.3);
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* ----- Settings ----- */
  .setting-row {
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-row label { display: block; font-size: 12px; color: var(--ink-mute); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-label="Amin Ventures">
      <svg viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="miter">
        <!-- Left vertical -->
        <line x1="6" y1="22" x2="6" y2="76" />
        <!-- Diagonal top from lower-left up to upper-right -->
        <line x1="6" y1="22" x2="54" y2="6" />
        <!-- Right vertical -->
        <line x1="54" y1="6" x2="54" y2="76" />
      </svg>
    </div>
    <div class="brand-name">AMIN VENTURES</div>
  </div>
  <div class="topbar-right">
    <div class="sync-badge">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText">Ready</span>
    </div>
  </div>
</div>

<main class="page" id="page">

// ---------- IndexedDB tiny wrapper ----------
const DB_NAME = 'av-inspector';
const DB_VER = 1;
let _db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (_db) return resolve(_db);
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('defects')) {
        const store = db.createObjectStore('defects', { keyPath: 'id' });
        store.createIndex('project', 'project', { unique: false });
        store.createIndex('createdAt', 'createdAt', { unique: false });
      }
      if (!db.objectStoreNames.contains('settings')) {
        db.createObjectStore('settings', { keyPath: 'key' });
      }
    };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(store, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete = () => resolve(value);
    tx.onerror = () => reject(tx.error);
  });
}
async function dbGet(store, key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbAll(store) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function dbDelete(store, key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function blobToDataUrl(blob) {
  return new Promise((resolve) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.readAsDataURL(blob);
  });
}

// Compress an image File/Blob, preserve orientation. Cap longer edge at 2000px (print-friendly).
async function compressImage(file) {
  const dataUrl = await blobToDataUrl(file);
  const img = new Image();
  await new Promise((res) => { img.onload = res; img.src = dataUrl; });
  const maxEdge = 2000;
  const longer = Math.max(img.width, img.height);
  const scale = Math.min(1, maxEdge / longer);
  const w = Math.round(img.width * scale);
  const h = Math.round(img.height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.88);
  const blob = await (await fetch(compressedDataUrl)).blob();
  const orientation = h > w ? 'portrait' : 'landscape';
  return { blob, dataUrl: compressedDataUrl, orientation, width: w, height: h };
}

function getGPS() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy
      }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 5000, maximumAge: 30000 }
    );
  });
}

function renderDefectCard(d) {
  const photoCount = (d.photos || []).length;
  const voiceCount = (d.voices || []).length;
  const thumbs = (d.photos || []).slice(0, 3).map(p =>
    `<img class="thumb" src="${p.dataUrl}" alt="" />`
  ).join('');
  const more = photoCount > 3 ? `<div class="thumb-more">+${photoCount - 3}</div>` : '';
  const status = d.status || 'Open';
  const statusClass = status.toLowerCase().replace(/\s+/g, '-');

  return `
    <div class="defect" data-id="${d.id}">
      <div class="defect-head">
        <div class="defect-title">${escapeHtml(d.description || 'Untitled')}</div>
        <span class="badge ${d.severity ? d.severity.toLowerCase() : 'minor'}">${d.severity || 'Minor'}</span>
      </div>
      <div class="defect-meta">
        <span class="status-pill ${statusClass}">${status}</span>
        ${d.location ? `<span>📍 ${escapeHtml(d.location)}</span>` : ''}
        ${d.trade ? `<span>🔧 ${escapeHtml(d.trade)}</span>` : ''}
        <span>${fmtDate(d.createdAt)}</span>
        ${voiceCount > 0 ? `<span class="voice-pill">🎙 ${voiceCount}</span>` : ''}
      </div>
      ${photoCount > 0 ? `<div class="defect-thumbs">${thumbs}${more}</div>` : ''}
    </div>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ---------- Annotation ----------
const annoState = { ctx: null, color: '#ef4444', strokes: [], idx: -1, base: null };

function openAnnotate(idx) {
  annoState.idx = idx;
  annoState.strokes = [];
  annoState.color = '#ef4444';
  $$('#annotateOverlay .color-dot').forEach((d, i) => {
    d.classList.toggle('active', i === 0);
  });

  const img = new Image();
  img.onload = () => {
    annoState.base = img;
    const canvas = $('#annotateCanvas');
    const wrap = canvas.parentElement;
    const maxW = wrap.clientWidth;
    const maxH = wrap.clientHeight;
    const scale = Math.min(maxW / img.width, maxH / img.height, 1);
    canvas.width = img.width;
    canvas.height = img.height;
    canvas.style.width = (img.width * scale) + 'px';
    canvas.style.height = (img.height * scale) + 'px';
    annoState.ctx = canvas.getContext('2d');
    redrawAnno();
  };
  img.src = state.photos[idx].dataUrl;

  $('#annotateOverlay').classList.add('show');
}

function redrawAnno() {
  const ctx = annoState.ctx;
  const canvas = $('#annotateCanvas');
  ctx.drawImage(annoState.base, 0, 0);
  for (const stroke of annoState.strokes) {
    ctx.strokeStyle = stroke.color;
    ctx.lineWidth = Math.max(canvas.width / 200, 4);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    stroke.points.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
  }
}

(function setupAnnoCanvas() {
  const canvas = $('#annotateCanvas');
  let drawing = false;
  let current = null;

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const x = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) * (canvas.width / r.width);
    const y = ((e.touches ? e.touches[0].clientY : e.clientY) - r.top) * (canvas.height / r.height);
    return { x, y };
  }

  function start(e) {
    e.preventDefault();
    drawing = true;
    current = { color: annoState.color, points: [pos(e)] };
    annoState.strokes.push(current);
    redrawAnno();
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    current.points.push(pos(e));
    redrawAnno();
  }
  function end() { drawing = false; current = null; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
})();

$$('#annotateOverlay .color-dot').forEach(d => {
  d.onclick = () => {
    $$('#annotateOverlay .color-dot').forEach(x => x.classList.remove('active'));
    d.classList.add('active');
    annoState.color = d.dataset.color;
  };
});
$('#annoUndo').onclick = () => { annoState.strokes.pop(); redrawAnno(); };
$('#annoCancel').onclick = () => $('#annotateOverlay').classList.remove('show');
$('#annoSave').onclick = async () => {

  };

};

// ---------- Voice recorder ----------
$('#recBtn').onclick = async () => {
  if (state.rec.mediaRec && state.rec.mediaRec.state === 'recording') {
    stopRecording();
  } else {
    await startRecording();
  }
};

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(stream);
    state.rec.mediaRec = mr;
    state.rec.chunks = [];
    state.rec.startedAt = Date.now();

    mr.ondataavailable = (e) => state.rec.chunks.push(e.data);
    mr.onstop = async () => {
      const blob = new Blob(state.rec.chunks, { type: 'audio/webm' });
      const dataUrl = await blobToDataUrl(blob);
      const durationSec = Math.round((Date.now() - state.rec.startedAt) / 1000);
      state.voices.push({ id: uid(), blob, dataUrl, durationSec });
      stream.getTracks().forEach(t => t.stop());
      renderVoiceList();
      $('#recBtn').classList.remove('recording');
      $('#recStatus').textContent = 'Tap to record';
      $('#recTime').style.display = 'none';
      clearInterval(state.rec.timer);
    };

    mr.start();
    $('#recBtn').classList.add('recording');
    $('#recStatus').textContent = 'Recording…';
    $('#recTime').style.display = 'block';
    state.rec.timer = setInterval(() => {
      const sec = Math.floor((Date.now() - state.rec.startedAt) / 1000);
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      $('#recTime').textContent = `${m}:${s}`;
    }, 200);
  } catch (err) {
    toast('Microphone access denied');
    console.error(err);
  }
}

function stopRecording() {
  if (state.rec.mediaRec) state.rec.mediaRec.stop();
}

}

// ---------- PDF ----------
async function buildPDF(defects, inspectorName) {
  const { jsPDF } = window.jspdf;

  // Default portrait letter; we'll add landscape pages individually as needed.
  const pdf = new jsPDF({ unit: 'pt', format: 'letter', orientation: 'portrait' });
  const PAGE_W = 612;   // letter portrait width in pt
  const PAGE_H = 792;   // letter portrait height in pt
  const M = 48;
  const HEADER_H = 56;  // brand header height
  const FOOTER_H = 24;

  // ---- Brand header drawn on every page ----
  function drawBrandHeader(page = pdf, w, h, projectName) {
    page.setFillColor(2, 6, 23);
    page.rect(0, 0, w, HEADER_H, 'F');

    // Mark
    const mx = M;
    const my = 14;
    const mw = 16;
    const mh = 28;
    page.setDrawColor(245, 240, 230);
    page.setLineWidth(1.6);
    page.setLineJoin('miter');
    page.line(mx, my + mh * 0.20, mx, my + mh);
    page.line(mx, my + mh * 0.20, mx + mw, my);
    page.line(mx + mw, my, mx + mw, my + mh);

    // Wordmark
    page.setTextColor(245, 240, 230);
    page.setFont('helvetica', 'bold');
    page.setFontSize(10);
    page.text('AMIN VENTURES', mx + mw + 12, 28);
    page.setFont('helvetica', 'normal');
    page.setFontSize(8);
    page.setTextColor(180, 170, 150);
    page.text('Field Inspection Report', mx + mw + 12, 42);

    // Project name on right
    if (projectName) {
      page.setTextColor(180, 170, 150);
      page.setFontSize(8);
      page.text(`PROJECT · ${String(projectName).toUpperCase()}`, w - M, 28, { align: 'right' });
      page.setTextColor(245, 240, 230);
      page.setFontSize(9);
      page.text(new Date().toLocaleDateString(), w - M, 42, { align: 'right' });
    }
  }

  function drawFooter(page, w, h, label) {
    page.setTextColor(160, 150, 130);
    page.setFont('helvetica', 'normal');
    page.setFontSize(7);
    page.text(label || 'Amin Ventures · Punch List', M, h - 14);
    const pageNum = page.internal.getCurrentPageInfo().pageNumber;
    page.text(`Page ${pageNum}`, w - M, h - 14, { align: 'right' });
  }

  // ---- Counts ----
  const counts = {
    crit: defects.filter(d => d.severity === 'Critical').length,
    maj: defects.filter(d => d.severity === 'Major').length,
    min: defects.filter(d => d.severity === 'Minor').length,
    open: defects.filter(d => (d.status || 'Open') === 'Open').length,
    inprog: defects.filter(d => d.status === 'In Progress').length,
    finalPL: defects.filter(d => d.status === 'Final Punch List').length,
    closed: defects.filter(d => d.status === 'Closed').length
  };

  // ---- COVER PAGE ----
  drawBrandHeader(pdf, PAGE_W, PAGE_H, state.project);

  pdf.setTextColor(2, 6, 23);
  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(32);
  pdf.text('Punch List Report', M, 130);

  pdf.setFont('helvetica', 'normal');
  pdf.setFontSize(10);
  pdf.setTextColor(120, 110, 90);
  let y = 170;
  const detail = (label, val) => {
    pdf.setTextColor(120, 110, 90);
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(8);
    pdf.text(label.toUpperCase(), M, y);
    pdf.setTextColor(2, 6, 23);
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(11);
    pdf.text(val || '—', M, y + 14);
    y += 38;
  };
  detail('Project', state.project || '—');
  detail('Inspector', inspectorName || '—');
  detail('Generated', new Date().toLocaleString());
  detail('Total Defects', String(defects.length));

  // Summary boxes — severity
  y += 10;
  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(11);
  pdf.setTextColor(2, 6, 23);
  pdf.text('Severity Summary', M, y);
  y += 16;

  const boxW = (PAGE_W - 2 * M - 24) / 3;
  const drawSummaryBox = (x, color, label, n) => {
    pdf.setFillColor(...color);
    pdf.roundedRect(x, y, boxW, 56, 8, 8, 'F');
    pdf.setTextColor(255, 255, 255);
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(24);
    pdf.text(String(n), x + 14, y + 30);
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(9);
    pdf.text(label.toUpperCase(), x + 14, y + 46);
  };
  drawSummaryBox(M, [153, 27, 27], 'Critical', counts.crit);
  drawSummaryBox(M + boxW + 12, [194, 65, 12], 'Major', counts.maj);
  drawSummaryBox(M + (boxW + 12) * 2, [202, 138, 4], 'Minor', counts.min);

  y += 72;

  // Status summary
  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(11);
  pdf.setTextColor(2, 6, 23);
  pdf.text('Status Summary', M, y);
  y += 16;

  const sBoxW = (PAGE_W - 2 * M - 36) / 4;
  const drawStatusBox = (x, color, label, n) => {
    pdf.setFillColor(255, 255, 255);
    pdf.setDrawColor(...color);
    pdf.setLineWidth(1.5);
    pdf.roundedRect(x, y, sBoxW, 50, 8, 8, 'FD');
    pdf.setTextColor(...color);
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(20);
    pdf.text(String(n), x + 12, y + 26);
    pdf.setTextColor(80, 80, 80);
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(7);
    pdf.text(label.toUpperCase(), x + 12, y + 42);
  };
  drawStatusBox(M + (sBoxW + 12) * 0, [55, 48, 163], 'Open', counts.open);
  drawStatusBox(M + (sBoxW + 12) * 1, [146, 64, 14], 'In Progress', counts.inprog);
  drawStatusBox(M + (sBoxW + 12) * 2, [157, 23, 77], 'Final PL', counts.finalPL);
  drawStatusBox(M + (sBoxW + 12) * 3, [6, 95, 70], 'Closed', counts.closed);

  y += 70;

  // Index of defects (compact list)
  if (defects.length > 0) {
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(11);
    pdf.setTextColor(2, 6, 23);
    pdf.text('Defect Index', M, y);
    y += 16;
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(9);
    pdf.setTextColor(60, 60, 60);
    let i = 1;
    for (const d of defects) {
      if (y > PAGE_H - M - 40) break; // truncate index if too long; details on later pages
      const sevPill = `[${(d.severity || 'Minor').charAt(0)}]`;
      const line = `${i}.  ${sevPill}  ${(d.description || 'Untitled').slice(0, 70)}${(d.description || '').length > 70 ? '…' : ''}`;
      pdf.text(line, M, y);
      pdf.setTextColor(120, 110, 90);
      pdf.text(`${d.location || '—'} · ${d.trade || '—'}`, M + 380, y);
      pdf.setTextColor(60, 60, 60);
      y += 14;
      i++;
    }
  }

  drawFooter(pdf, PAGE_W, PAGE_H, 'Amin Ventures · Punch List · Cover');

  // ---- DEFECT DETAIL PAGES ----
  let defectIndex = 0;
  for (const d of defects) {
    defectIndex++;

    // Detail page (portrait)
    pdf.addPage('letter', 'portrait');
    drawBrandHeader(pdf, PAGE_W, PAGE_H, d.project || state.project);

    let py = HEADER_H + 28;

    // Defect index pill
    pdf.setFillColor(2, 6, 23);
    pdf.roundedRect(M, py - 14, 70, 22, 11, 11, 'F');
    pdf.setTextColor(245, 240, 230);
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(9);
    pdf.text(`DEFECT ${String(defectIndex).padStart(3, '0')}`, M + 35, py + 1, { align: 'center' });

    // Severity pill (right side)
    const sevColor = d.severity === 'Critical' ? [153, 27, 27]
      : d.severity === 'Major' ? [194, 65, 12]
      : [202, 138, 4];
    pdf.setFillColor(...sevColor);
    pdf.roundedRect(PAGE_W - M - 80, py - 14, 80, 22, 11, 11, 'F');
    pdf.setTextColor(255, 255, 255);
    pdf.text((d.severity || 'Minor').toUpperCase(), PAGE_W - M - 40, py + 1, { align: 'center' });

    py += 30;

    // Title
    pdf.setTextColor(2, 6, 23);
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(20);
    const titleLines = pdf.splitTextToSize(d.description || 'Untitled', PAGE_W - 2 * M);
    pdf.text(titleLines, M, py);
    py += titleLines.length * 24;
    py += 8;

    // Divider
    pdf.setDrawColor(228, 220, 203);
    pdf.setLineWidth(0.5);
    pdf.line(M, py, PAGE_W - M, py);
    py += 18;

    // Meta block — two columns
    const meta = [
      ['Location', d.location || '—'],
      ['Trade', d.trade || '—'],
      ['Status', d.status || 'Open'],
      ['Responsible', d.responsible || '—'],
      ['Due Date', d.dueDate || '—'],
      ['Reported', new Date(d.createdAt).toLocaleString()]
    ];
    if (d.gps) meta.push(['GPS', `${d.gps.lat.toFixed(5)}, ${d.gps.lng.toFixed(5)}`]);
    if ((d.voices || []).length) meta.push(['Voice Notes', `${d.voices.length} attached (heard in app)`]);
    meta.push(['Photos', `${(d.photos || []).length} captured`]);

    const colW = (PAGE_W - 2 * M) / 2;
    let col = 0;
    let metaY = py;
    for (const [k, v] of meta) {
      const x = M + col * colW;
      pdf.setTextColor(120, 110, 90);
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(8);
      pdf.text(k.toUpperCase(), x, metaY);
      pdf.setTextColor(2, 6, 23);
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(11);
      const vLines = pdf.splitTextToSize(String(v), colW - 16);
      pdf.text(vLines, x, metaY + 14);
      col++;
      if (col === 2) { col = 0; metaY += 38; }
    }
    py = metaY + (col === 1 ? 38 : 0) + 10;

    // Photo thumbnails preview row (small)
    const photos = d.photos || [];
    if (photos.length) {
      pdf.setTextColor(120, 110, 90);
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(8);
      pdf.text(`PHOTOS — ${photos.length} TOTAL · DETAIL PAGES FOLLOW`, M, py);
      py += 14;

      const thumbSize = 80;
      const gap = 8;
      const perRow = Math.floor((PAGE_W - 2 * M + gap) / (thumbSize + gap));
      let tCol = 0;
      let tY = py;
      for (let i = 0; i < photos.length; i++) {
        if (tY + thumbSize > PAGE_H - FOOTER_H - M) break; // keep on page
        const tx = M + tCol * (thumbSize + gap);
        try {
          // Always place thumb in landscape-ish square (jsPDF will handle aspect)
          const p = photos[i];
          const ratio = p.height && p.width ? (p.height / p.width) : 1;
          const tw = ratio > 1 ? thumbSize * (p.width / p.height) : thumbSize;
          const th = ratio > 1 ? thumbSize : thumbSize * ratio;
          pdf.addImage(p.dataUrl, 'JPEG', tx, tY, tw, th);
          // Index number
          pdf.setFillColor(2, 6, 23);
          pdf.roundedRect(tx + 4, tY + 4, 18, 14, 3, 3, 'F');
          pdf.setTextColor(255, 255, 255);
          pdf.setFont('helvetica', 'bold');
          pdf.setFontSize(8);
          pdf.text(String(i + 1), tx + 13, tY + 13, { align: 'center' });
        } catch (e) { console.error('thumb fail', e); }
        tCol++;
        if (tCol === perRow) { tCol = 0; tY += thumbSize + gap; }
      }
    }

    drawFooter(pdf, PAGE_W, PAGE_H, `Amin Ventures · Punch List · Defect ${defectIndex} · Detail`);

    // ---- ONE PAGE PER PHOTO ----
    for (let pi = 0; pi < photos.length; pi++) {
      const p = photos[pi];
      const isPortrait = (p.orientation === 'portrait')
        || (p.height && p.width && p.height > p.width);
      const orient = isPortrait ? 'portrait' : 'landscape';
      pdf.addPage('letter', orient);

      const pw = isPortrait ? 612 : 792;
      const ph = isPortrait ? 792 : 612;

      drawBrandHeader(pdf, pw, ph, d.project || state.project);

      // Photo area: most of the page, leave room for metadata strip at bottom
      const META_STRIP_H = 110;
      const photoTop = HEADER_H + 16;
      const photoBottom = ph - META_STRIP_H - 16;
      const photoLeft = M;
      const photoRight = pw - M;
      const availableW = photoRight - photoLeft;
      const availableH = photoBottom - photoTop;

      // Compute fitted dimensions preserving aspect
      let imgW = p.width || (isPortrait ? 1500 : 2000);
      let imgH = p.height || (isPortrait ? 2000 : 1500);
      const aspect = imgW / imgH;
      let drawW, drawH;
      if (availableW / availableH > aspect) {
        drawH = availableH;
        drawW = drawH * aspect;
      } else {
        drawW = availableW;
        drawH = drawW / aspect;
      }
      const drawX = photoLeft + (availableW - drawW) / 2;
      const drawY = photoTop + (availableH - drawH) / 2;

      try {
        pdf.addImage(p.dataUrl, 'JPEG', drawX, drawY, drawW, drawH, undefined, 'FAST');
      } catch (e) { console.error('photo page image fail', e); }

      // Annotated badge on photo
      if (p.annotated) {
        pdf.setFillColor(22, 101, 52);
        pdf.roundedRect(drawX + 8, drawY + 8, 70, 18, 4, 4, 'F');
        pdf.setTextColor(255, 255, 255);
        pdf.setFont('helvetica', 'bold');
        pdf.setFontSize(8);
        pdf.text('MARKED UP', drawX + 43, drawY + 20, { align: 'center' });
      }

      // Metadata strip at bottom
      const stripY = ph - META_STRIP_H;
      pdf.setFillColor(245, 240, 230);
      pdf.rect(0, stripY, pw, META_STRIP_H, 'F');
      pdf.setDrawColor(228, 220, 203);
      pdf.setLineWidth(0.5);
      pdf.line(0, stripY, pw, stripY);

      // Left side: defect title + photo number
      pdf.setTextColor(120, 110, 90);
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(7);
      pdf.text(`DEFECT ${String(defectIndex).padStart(3, '0')}  ·  PHOTO ${pi + 1} OF ${photos.length}`, M, stripY + 18);

      pdf.setTextColor(2, 6, 23);
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(13);
      const stripTitleLines = pdf.splitTextToSize(d.description || 'Untitled', pw - 2 * M - 220);
      pdf.text(stripTitleLines.slice(0, 2), M, stripY + 36);

      // Severity pill on strip
      pdf.setFillColor(...sevColor);
      pdf.roundedRect(M, stripY + 50, 70, 18, 9, 9, 'F');
      pdf.setTextColor(255, 255, 255);
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(8);
      pdf.text((d.severity || 'Minor').toUpperCase(), M + 35, stripY + 62, { align: 'center' });

      // Status pill
      const stColor = (d.status || 'Open') === 'Closed' ? [6, 95, 70]
        : d.status === 'Final Punch List' ? [157, 23, 77]
        : d.status === 'In Progress' ? [146, 64, 14]
        : [55, 48, 163];
      pdf.setFillColor(...stColor);
      pdf.roundedRect(M + 78, stripY + 50, 100, 18, 9, 9, 'F');
      pdf.setTextColor(255, 255, 255);
      pdf.text((d.status || 'Open').toUpperCase(), M + 128, stripY + 62, { align: 'center' });

      // Right side: meta details
      const rx = pw - M;
      pdf.setTextColor(120, 110, 90);
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(7);
      pdf.text('LOCATION', rx, stripY + 18, { align: 'right' });
      pdf.setTextColor(2, 6, 23);
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(10);
      pdf.text(d.location || '—', rx, stripY + 32, { align: 'right' });

      pdf.setTextColor(120, 110, 90);
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(7);
      pdf.text('TRADE', rx, stripY + 50, { align: 'right' });
      pdf.setTextColor(2, 6, 23);
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(10);
      pdf.text(d.trade || '—', rx, stripY + 64, { align: 'right' });

      pdf.setTextColor(120, 110, 90);
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(7);
      pdf.text('REPORTED', rx, stripY + 82, { align: 'right' });
      pdf.setTextColor(2, 6, 23);
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(9);
      pdf.text(new Date(d.createdAt).toLocaleString(), rx, stripY + 96, { align: 'right' });

      drawFooter(pdf, pw, ph, `Amin Ventures · Punch List · Defect ${defectIndex} · Photo ${pi + 1}`);
    }
  }

  return pdf;
}

// ---------- Email ----------
async function sendEmail(defects, inspectorName, recipient) {
  toast('Generating PDF…');
  const pdf = await buildPDF(defects, inspectorName);
  const filename = `punchlist-${(state.project || 'report').replace(/\s+/g,'_')}-${Date.now()}.pdf`;

  // Save the PDF locally so the inspector has a copy
  pdf.save(filename);

  const subject = `Punch List — ${state.project || 'Inspection'} — ${new Date().toLocaleDateString()}`;
  const body = `Hello,

Attached is the punch list report for ${state.project || 'the project'}.

Summary:
• Total defects: ${defects.length}
• Critical: ${defects.filter(d => d.severity === 'Critical').length}
• Major: ${defects.filter(d => d.severity === 'Major').length}
• Minor: ${defects.filter(d => d.severity === 'Minor').length}

Inspector: ${inspectorName || '—'}
Date: ${new Date().toLocaleString()}

** Important: The PDF was downloaded to this device. Please attach "${filename}" from your Downloads folder before sending.

Generated by AV Inspector.`;

  // mailto: cannot attach files (browser security). The PDF is saved to Downloads;
  // the user attaches it manually. This is the only reliable, offline-first path.
  const mailto = `mailto:${encodeURIComponent(recipient)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = mailto;

  setTimeout(() => {
    toast('PDF saved to Downloads — attach it to the email');
  }, 1500);
}

// ---------- Wire up ----------
$('#fab').onclick = async () => {
  if (!state.project) {
    toast('Select a project first');
    openProjectPicker();
    return;
  }
  openDefectForm(null);
};

$$('.botnav .nav-item').forEach(b => {
  b.onclick = () => setView(b.dataset.view);
});

$$('[data-close]').forEach(b => {
  b.onclick = (e) => {
    e.target.closest('.sheet-back').classList.remove('show');
  };
});

// Click outside sheet to close
$$('.sheet-back').forEach(s => {
  s.addEventListener('click', (e) => {
    if (e.target === s) s.classList.remove('show');
  });
});

// ---------- Boot ----------
(async function init() {
  await openDB();
  state.project = await getSetting('lastProject', null);
  updateSync();
  setView('list');

  // Register service worker
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('./sw.js');
    } catch (e) { console.warn('SW register failed', e); }
  }
})();
</script>
